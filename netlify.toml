[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback so client-side routing / deep links resolve to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# VITE_MAPTILER_KEY is provided as a build environment variable in the Netlify
# dashboard (Site settings → Environment variables), not committed here.
